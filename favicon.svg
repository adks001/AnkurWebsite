<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round" />
  <!-- Data nodes/triangle -->
  <polygon points="50,22 80,72 20,72" fill="url(#grad2)" opacity="0.75" />
  <!-- Center hub -->
  <circle cx="50" cy="53" r="18" fill="url(#grad1)" />
  <!-- Letter A -->
  <text x="50" y="60" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">A</text>
</svg>
